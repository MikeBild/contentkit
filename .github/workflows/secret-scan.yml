name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The default rule set plus one allowlist for the two documented
          # placeholder credentials in the production walkthrough. Named
          # explicitly rather than relying on root auto-detection.
          GITLEAKS_CONFIG: .gitleaks.toml
