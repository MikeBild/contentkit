<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <!-- Without this the UA paints its default white canvas and light-scheme
         scrollbars and form controls before the stylesheet lands, partly
         defeating the pre-paint script below. The sibling console carries the
         same line for the same reason. -->
    <meta name="color-scheme" content="light dark" />
    <title>ContentKit Cockpit</title>
    <!-- The app icon, same motif as the sidebar wordmark. The href is written
         absolute from the site root and rewritten by Vite to the real base
         (`/cockpit/`), because this document is also served for deep routes
         such as /cockpit/releases/42 — a relative href would resolve against
         those and point at a file that is not there. A favicon that 404s looks
         like compliance and is not. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Applied before first paint so a dark-mode reload never flashes light.
      try {
        const stored = localStorage.getItem('ck-cockpit-theme')
        const dark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
