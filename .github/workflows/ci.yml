name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Node 20 is a supported engine and a required status check, so its result
      # has to be a result. Without this it is cancelled the moment 22 fails and
      # no recent commit has a passing 20.x run at all.
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:contract
      - run: npm run test:smoke
      - run: npm run check:embedded-drift
      - run: npm run check:docs-drift
      - run: npm audit --audit-level=high

  # The console is a quarter of the codebase and the primary deliverable inside
  # the binary, and until this job existed CI never type-checked it, never
  # regenerated its two generated files and never audited its toolchain. That
  # made `tsc --noEmit` — the only thing in the repository that compares a
  # documented response shape to the code consuming it — a check nobody ran.
  cockpit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/cockpit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          # apps/cockpit is deliberately not a workspace (see
          # scripts/build-cockpit.sh), so its lockfile has to be named here or
          # its ~900-package install is uncached on every run.
          cache-dependency-path: |
            package-lock.json
            apps/cockpit/package-lock.json
      - run: npm ci
      # site.scoped.css is gitignored and so cannot drift, but it can be empty:
      # the generator now refuses that rather than shipping an unstyled console.
      - run: npm run gen:css
      - run: npm run gen:api
      # schema.d.ts is tracked, generated, and was gated by nothing — `gen:api`
      # is in neither `build` nor any test, so it only updated when someone
      # remembered to type it. Stale types are still valid types, so tsc alone
      # would never notice.
      - name: schema.d.ts is in sync with docs/openapi.json
        run: git diff --exit-code -- src/api/schema.d.ts
      - run: npx tsc --noEmit
      # Everything above this line reads the console as text. `tsc` proves the
      # types line up and the Node suite greps the source, so a dialog that has
      # stopped trapping focus, a progress bar that has started inventing a
      # percentage and a spinner announcing itself twice all compile, all match,
      # and all ship. These render the components and ask the DOM instead — the
      # step that fails when the console misbehaves rather than when it is
      # misspelled.
      - name: Behaviour (jsdom) — focus, roles and announcements
        # `--prefix` is resolved against the process's cwd, and this job's default
        # cwd is already apps/cockpit; the repository root is where this exact
        # command means what it says.
        working-directory: ${{ github.workspace }}
        run: npm --prefix apps/cockpit run test
      - run: npm run build
      # The root gate proves nothing about this tree: it has its own lockfile and
      # `build-cockpit.sh` installs it with --no-audit.
      - run: npm audit --audit-level=high

  # jsdom performs no layout. `clientHeight` is 0 there, so the `cockpit` job
  # above renders the console and asks the DOM about roles, focus and
  # announcements — and can ask it nothing at all about geometry. That is not a
  # theoretical gap: in 4.8.0 an unbounded shell wrapper made nine tenths of the
  # releases page unreachable, with no scrollbar to say so, and shipped past 1078
  # source tests, 79 DOM tests and six adversarial reviews. A user found it.
  #
  # This job drives the built console in Chromium at 1280, 768 and 390, and
  # asserts the six things only a browser can answer. It runs against
  # scripts/cockpit-fixture.mjs — the bundle on a local origin with an API
  # synthesized from docs/openapi.json — so it needs no database and no session
  # and finishes in about ten seconds. A browser gate that is slow gets skipped,
  # and a skipped gate is worse than none because it looks like coverage.
  cockpit-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          # Same reason as the `cockpit` job: apps/cockpit is deliberately not a
          # workspace, so its lockfile has to be named or its install is uncached.
          cache-dependency-path: |
            package-lock.json
            apps/cockpit/package-lock.json
      - run: npm ci
      # The only CI job that needs a browser binary. The three site validators in
      # `validate:visuals` need one too and run nowhere but a developer's machine.
      # The hosted runner already carries the system libraries needed to launch
      # Chromium. Installing them again makes this product gate depend on a
      # live Ubuntu mirror before the browser test can even start (and has hung
      # until the job timeout). Install the pinned browser only; the real launch
      # below remains the authoritative dependency and behaviour check.
      - run: npx playwright install chromium
      # assets/cockpit is gitignored build output, and the suite refuses to run
      # without it rather than validating a stale bundle. build-cockpit.sh
      # installs apps/cockpit's own dependencies if they are missing.
      - run: npm run cockpit:build
      - run: npm run validate:cockpit:browser

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: contentkit-test
          POSTGRES_DB: contentkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contentkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTENTKIT_TEST_DATABASE_URL: postgresql://postgres:contentkit-test@127.0.0.1:5432/contentkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  # 4.9.1 moved the release build onto a worker thread and added
  # test/load/release-build-event-loop.test.mjs to prove it with a number — the
  # only item in docs/OPEN-WORK.md whose fix is provable that way. That file was
  # in no npm script and no job, so from the commit that added it onward it ran
  # only when someone typed its path from memory: the regression it exists to
  # catch would have landed silently.
  #
  # It is deliberately not in `npm test` (see the file's own header) because it
  # builds a real site twice. That is an argument for its own job, not for no
  # job — the same shape `integration`, `binary-e2e` and `benchmark` already
  # have. Measured here: 14s on 22.x, 17s on 20.x.
  #
  # Both matrix legs, because the thing under test is `worker_threads` and 20.x
  # is a supported engine and a required check.
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:load

  binary-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run test:e2e:local

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: CONTENTKIT_BENCHMARK_ASSERT=1 npm run --silent benchmark | tee benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: benchmark.json
